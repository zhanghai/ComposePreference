[versions]
android-buildTools = "37.0.0"
android-compileSdk = "37"
android-gradlePlugin = "9.4.1"
android-minSdk = "23"
android-targetSdk = "37"
androidx-activity = "1.13.0"
compose = "1.12.1"
compose-material-iconsExtended = "1.7.3"
# TODO: Migrate to BOM once it's available: https://youtrack.jetbrains.com/projects/CMP/issues/CMP-6654
compose-material3 = "1.12.0-alpha03"
dokka = "2.2.0"
# https://kotlinlang.org/docs/multiplatform/whats-new-compose-112.html#dependencies
jetbrains-androidx-lifecycle = "2.11.0"
kotlin = "2.4.20"
kotlinx-binaryCompatibilityValidator = "0.18.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
mavenPublish = "0.37.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-compose-ui-testManifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose" }
compose-material-iconsExtended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "compose-material-iconsExtended" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-ui-toolingPreview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
jetbrains-androidx-lifecycle-runtimeCompose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "jetbrains-androidx-lifecycle" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradlePlugin" }
android-kotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradlePlugin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinx-binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "kotlinx-binaryCompatibilityValidator" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
